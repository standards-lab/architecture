# Project kind: this repository is context (the organization's documentation landing
# zone), not production source code.
[project]
kind = "context"
# The repository's one deterministic check, which every slice and review runs.
check = "scripts/check.sh"

# Remote platform, the command that publishes a finished branch, and the command that merges
# it. The repository has no CI, so the merge waits on no checks.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
