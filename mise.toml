# The architecture layer's tools and the tasks that check it and report currency.
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.0", version_prefix = "marathon/v" }
jq = "1.8.2"

[tasks.check]
description = "Resolve every relative Markdown link, check every page's front matter, and run lint-context and lint-references; reads no network, writes nothing"
run = "scripts/check.sh"

[tasks.currency]
description = "Report every pin behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
